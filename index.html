<!DOCTYPE html>
<html>
<head>
    <title>SchoolNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1 class="title">SchoolNotes</h1>

    <h2 class="Sub">Save Your SchoolNotes</h2>

<div class="container">
    <div class="square"> 

    <button id="noteButton", class="NoteButton">Add A Note</button>

    <div id="notesGrid" class="notes-grid"></div>

    <div id="notePopup" class="popup">

        <div class="popup-content">

        <button id="closeButton" class="CloseButton">Back</button>

            <h2>Add a Note</h2>

            <input id="noteTitle" type="text"
    placeholder="Note title">
            
            <textarea id="noteDescription"
    placeholder="Description"></textarea>

            <textarea id="noteNotes"
    placeholder="Notes"></textarea>

            <button id="saveButton" class="SaveButton">Save Note</button>

        </div>
    </div> 
</div>

</body>
<script src="script.js"></script>
</html>
